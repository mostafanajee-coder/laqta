<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title data-i18n="app_name">Laqta</title>
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="popup-header">
      <img src="../../icons/icon-32.png" width="22" height="22" alt="">
      <h1 data-i18n="menu_root">Laqta</h1>
    </header>

    <section class="actions" aria-label="Capture modes">
      <button class="card-button" data-mode="full" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        <span class="card-text">
          <span class="card-title" data-i18n="popup_capture_full">Full page</span>
          <span class="card-hint muted" data-i18n="popup_capture_full_hint">Scrolls through the whole page and stitches it</span>
        </span>
        <kbd data-shortcut="capture-full"></kbd>
      </button>

      <button class="card-button" data-mode="visible" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>
        <span class="card-text">
          <span class="card-title" data-i18n="popup_capture_visible">Visible part</span>
          <span class="card-hint muted" data-i18n="popup_capture_visible_hint">Only what you see right now</span>
        </span>
        <kbd data-shortcut="capture-visible"></kbd>
      </button>

      <button class="card-button" data-mode="selection" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
        <span class="card-text">
          <span class="card-title" data-i18n="popup_capture_selection">Selected area</span>
          <span class="card-hint muted" data-i18n="popup_capture_selection_hint">Drag a rectangle on the page</span>
        </span>
        <kbd data-shortcut="capture-selection"></kbd>
      </button>
    </section>

    <p id="status" class="status" role="status" aria-live="polite" hidden></p>

    <footer class="popup-footer">
      <a class="btn" id="openHistory" href="../history/history.html" target="_blank" rel="noopener">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span data-i18n="popup_history">History</span>
      </a>
      <button class="btn" id="openOptions" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span data-i18n="popup_options">Options</span>
      </button>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
